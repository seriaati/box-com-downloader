[project]
name = "box-com-downloader"
version = "0.2.0"
description = "Download protected PDF, docx, and video files from box.com"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyvirtualdisplay>=3.0",
    "selenium>=4.46.0",
    "urllib3>=2.0",
]

[project.scripts]
box-com-downloader = "box_com_downloader.main:main"
bcd = "box_com_downloader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["box_com_downloader"]
